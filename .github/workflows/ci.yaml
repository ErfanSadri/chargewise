name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SESSION_SECRET: chargewise_ci_only_session_secret_at_least_32_characters
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: chargewise_test
          POSTGRES_USER: chargewise
          POSTGRES_PASSWORD: chargewise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargewise -d chargewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.6.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: "11.18.0"
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check migrations
        run: pnpm db:check
        env:
          DATABASE_URL: postgresql://chargewise:chargewise_ci@127.0.0.1:5432/chargewise_test

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://chargewise:chargewise_ci@127.0.0.1:5432/chargewise_test

      - name: Build
        run: pnpm build
